      <text x="1016" y="217" fill="#43464C">:445</text>
      <text x="1074" y="217" fill="#43464C">smb</text>
    </g>

    <rect x="704" y="226" width="432" height="34" fill="#FBE9DC"/>
    <rect x="704" y="226" width="3" height="34" fill="#C2410C"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
