    <text x="1112" y="98" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A8478">glutton · 8db8fe53</text>

    <line x1="704" y1="112" x2="1136" y2="112" stroke="#E9E3D7"/>

    <text x="724" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#C2410C">❯</text>
    <text x="746" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#15171B">scanner eq "censys"</text>

    <line x1="704" y1="158" x2="1136" y2="158" stroke="#E9E3D7"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="724" y="183" fill="#6C6E75">15:38:57</text>
