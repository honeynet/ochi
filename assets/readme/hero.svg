<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Ochi — live event console for Glutton honeypots</title>
  <desc id="heroDesc">Ochi wordmark with the line “A live console for Glutton honeypot events. Filter the noise. Keep what matters.” Next to it, a live event panel filtered by the query scanner eq “censys”, listing four attacks from documentation IP ranges with one event highlighted.</desc>

  <rect width="1200" height="360" rx="24" fill="#F4F2ED"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#E2DCD0"/>

  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="600" letter-spacing="2.6" fill="#8B8477">HONEYPOT EVENT CONSOLE</text>

    <text x="-4" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="104" font-weight="700" letter-spacing="-4" fill="#15171B">Ochi</text>

    <text x="0" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#454A52">A live console for Glutton honeypot events.</text>
    <text x="0" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#454A52">Filter the noise. Keep what matters.</text>

    <text x="0" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#7C776C">Go · Svelte · SQLite · WebSocket</text>
  </g>

  <g id="event-panel">
