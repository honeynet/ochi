name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's run in progress. Pushes to main
# are grouped by commit, so every commit on main still gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

      # govulncheck reports both vulnerabilities in the modules this repository requires
      # and vulnerabilities in the Go standard library. Only the first kind is something a
      # change here can fix, so only that kind fails the build; see the filter below.
      - name: Scan dependencies for known vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -json ./... > "$RUNNER_TEMP/govulncheck.json"

          # -json always exits 0, so the decision is made here. In every finding trace[0] is
          # the vulnerable symbol: it carries a function only when that symbol is reachable
          # from this code, and its module says whether the fix is a dependency bump or a
          # newer Go toolchain.
          reachable() {
            jq -sr --argjson stdlib "$1" '
              [ .[] | select(has("finding")) | .finding
                | select(.trace[0].function != null)
                | select(if $stdlib then .trace[0].module == "stdlib"
                         else .trace[0].module != "stdlib" end)
                | .osv ] | unique | join(" ")' "$RUNNER_TEMP/govulncheck.json"
          }

          stdlib=$(reachable true)
          dependencies=$(reachable false)

          # Reported, but not a failure: standard-library advisories are fixed by moving to a
          # patched Go release, on the Go team's schedule rather than this repository's, and
          # blocking every pull request until that happens would say nothing about the change.
          if [ -n "$stdlib" ]; then
            echo "::notice title=Reachable Go standard library advisories::$stdlib (fixed by raising the go directive in go.mod to a patched release)"
          fi

          if [ -n "$dependencies" ]; then
            echo "::error title=Reachable vulnerability in a required module::$dependencies (details at https://pkg.go.dev/vuln/<id>)"
            exit 1
          fi

          echo "No reachable vulnerabilities in required modules."
