name: Svelte CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's run in progress. Pushes to main
# are grouped by commit, so every commit on main still gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: 'package.json'
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - name: Validate generated files are up-to-date
        run: npm run generate-check
      - run: npm run check
      - run: npm run test
      - run: npx prettier --check "**/*.{svelte,ts}"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
