name: Svelte CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that PR's run in progress. Pushes to main
# are grouped by commit, so every commit on main still gets its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: "npm"
      - run: npm ci

      # Only what ships is a build failure. Dev-only advisories are reported instead, because
      # they are not part of the bundle and the fix is often a major upgrade of a test tool,
      # which should not block an unrelated pull request.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit development dependencies
        run: |
          npm audit --audit-level=high ||
            echo "::notice title=Development dependency advisories::npm audit reported findings in devDependencies; see the log above."
      - run: npm run build --if-present
      - name: Validate generated files are up-to-date
        run: npm run generate-check
      - run: npm run check
      - run: npm run test
      - run: npx prettier --check "**/*.{svelte,ts}"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
