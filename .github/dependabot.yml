# Dependabot configuration
# Security updates are unaffected by this file. This adds scheduled,
# non-security version updates. Routine minor and patch bumps are grouped
# into one pull request per ecosystem; majors stay ungrouped so each one
# arrives on its own and can be reviewed properly. Each ecosystem is capped
# at 3 open PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
